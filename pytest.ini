[pytest]
asyncio_mode = auto
testpaths = tests
addopts =
    -v
    --tb=short
    --strict-markers
    --durations=10
    --html=reports/test_report.html
    --self-contained-html
    --cov=backend
    --cov-report=html:reports/coverage
    --cov-report=term-missing
    --cov-fail-under=60

markers =
    unit: Unit tests - fast, no external dependencies
    api: API integration tests
    rag: RAG pipeline tests
    slow: Slow tests that need real external services
